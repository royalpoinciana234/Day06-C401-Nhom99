services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app  # mount local code → uvicorn --reload picks up changes instantly
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app  # streamlit already watches for file changes
    depends_on:
      - backend
    restart: unless-stopped
